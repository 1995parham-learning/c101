name: build

on:
  push:
  pull_request:

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and library dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake meson ninja-build pkg-config \
            libglib2.0-dev libsoup2.4-dev libwayland-dev wayland-protocols \
            libgsl-dev libreadline-dev default-jdk gcc-arm-linux-gnueabihf

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to /usr/local/bin

      - name: Build every example
        run: ./scripts/build-all.sh
